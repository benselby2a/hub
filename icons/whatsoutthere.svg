<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d5f63"/>
      <stop offset="100%" stop-color="#1aa8a0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="188" fill="#ffffff20"/>
  <!-- Whale body -->
  <ellipse cx="250" cy="190" rx="90" ry="55" fill="#4fc3f7"/>
  <ellipse cx="250" cy="200" rx="75" ry="40" fill="#29b6f6"/>
  <!-- Whale tail -->
  <path d="M340 185 Q370 155 365 130 Q355 150 340 160 Q345 145 335 125 Q330 150 320 165" fill="#4fc3f7"/>
  <!-- Whale eye -->
  <circle cx="195" cy="180" r="8" fill="#fff"/>
  <circle cx="197" cy="179" r="4" fill="#1a1a2e"/>
  <!-- Whale mouth -->
  <path d="M165 200 Q195 215 230 205" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
  <!-- Whale spout -->
  <path d="M220 140 Q215 120 205 110 M220 140 Q225 118 235 108" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
  <!-- Stars -->
  <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#fff9c4" transform="translate(140 300)"/>
  <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#fff9c4" transform="translate(378 272) scale(0.75)"/>
  <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#fff9c4" transform="translate(402 344) scale(0.55)"/>
  <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#fff9c4" transform="translate(120 372) scale(0.6)"/>
  <!-- Telescope -->
  <g transform="translate(255 350) scale(1.3) translate(-255 -350)">
    <!-- Tripod -->
    <line x1="250" y1="352" x2="216" y2="404" stroke="#5d4037" stroke-width="8" stroke-linecap="round"/>
    <line x1="250" y1="352" x2="284" y2="404" stroke="#5d4037" stroke-width="8" stroke-linecap="round"/>
    <line x1="250" y1="352" x2="250" y2="398" stroke="#4e342e" stroke-width="7" stroke-linecap="round"/>
    <!-- Tube -->
    <g transform="rotate(-30 257 345)">
      <rect x="196" y="330" width="124" height="30" rx="15" fill="#cfd8dc"/>
      <rect x="196" y="330" width="124" height="30" rx="15" fill="none" stroke="#90a4ae" stroke-width="3"/>
      <rect x="308" y="322" width="22" height="46" rx="6" fill="#90a4ae"/>
      <rect x="178" y="337" width="22" height="16" rx="5" fill="#78909c"/>
      <line x1="240" y1="330" x2="240" y2="360" stroke="#90a4ae" stroke-width="3"/>
    </g>
    <!-- Mount -->
    <circle cx="250" cy="352" r="12" fill="#455a64"/>
  </g>
</svg>
